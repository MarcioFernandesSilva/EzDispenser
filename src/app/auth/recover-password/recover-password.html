<div
  class="min-h-screen bg-slate-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 font-sans"
>
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-slate-100">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900">
        {{ step === 1 ? 'Recuperar Senha' : 'Redefinir Senha' }}
      </h2>
      <p class="mt-2 text-center text-sm text-slate-600">
        {{
          step === 1
            ? 'Digite seu email para receber o código.'
            : 'Digite o código recebido e sua nova senha.'
        }}
      </p>
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 text-red-700 p-3 rounded-md text-sm">
      {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="bg-green-50 text-green-700 p-3 rounded-md text-sm">
      {{ successMessage }}
    </div>

    <form
      [formGroup]="formEmail"
      (ngSubmit)="onRequestCode()"
      *ngIf="step === 1"
      class="mt-8 space-y-6"
    >
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="email-address" class="block text-sm font-medium text-slate-700 mb-1"
            >Email</label
          >
          <input
            id="email-address"
            type="email"
            formControlName="email"
            required
            class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
            placeholder="seu@email.com"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="formEmail.invalid || isLoading"
        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none disabled:opacity-50"
      >
        {{ isLoading ? 'Enviando...' : 'Enviar Código' }}
      </button>
    </form>

    <form
      [formGroup]="formReset"
      (ngSubmit)="onResetPassword()"
      *ngIf="step === 2"
      class="mt-8 space-y-4"
    >
      <app-input-text
        [parentForm]="formReset"
        controlName="code"
        label="Código de Verificação"
        placeholder="Ex: 123456"
      ></app-input-text>

      <app-input-password
        [parentForm]="formReset"
        controlName="password"
        label="Nova Senha"
        placeholder="Min 8 caracteres"
      ></app-input-password>

      <app-input-password
        [parentForm]="formReset"
        controlName="confirmPassword"
        label="Confirmar Senha"
        placeholder="Repita a nova senha"
      ></app-input-password>

      <button
        type="submit"
        [disabled]="formReset.invalid || isLoading"
        class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none disabled:opacity-50"
      >
        {{ isLoading ? 'Salvando...' : 'Redefinir Senha' }}
      </button>
    </form>

    <div class="text-center">
      <a routerLink="/auth/login" class="font-medium text-indigo-600 hover:text-indigo-500 text-sm">
        &larr; Voltar para Login
      </a>
    </div>
  </div>
</div>
