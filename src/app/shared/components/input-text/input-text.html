<div [formGroup]="parentForm">
  <label [for]="controlName" class="block text-sm font-medium text-slate-700 mb-1">
    {{ label }}
  </label>
  <input
    [id]="controlName"
    type="text"
    [formControlName]="controlName"
    [placeholder]="placeholder"
    class="appearance-none block w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
    [class.border-red-500]="
      parentForm.get(controlName)?.invalid && parentForm.get(controlName)?.touched
    "
  />
</div>
